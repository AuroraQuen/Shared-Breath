<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Breath</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f5f2;
      --text: #2a2520;
      --text-muted: #8a7f78;
      --rule: #e4ddd7;
      --max-width: 640px;
    }

    html { font-size: 18px; background: var(--bg); color: var(--text); }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1.75rem;
    }

    header {
      width: 100%;
      max-width: var(--max-width);
      padding: 5.5rem 0 4rem;
      text-align: center;
    }

    header h1 {
      font-size: 1rem;
      font-weight: normal;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    header p {
      margin-top: 1.4rem;
      font-size: 0.9rem;
      line-height: 1.85;
      color: var(--text-muted);
      font-style: italic;
    }

    .breath-line {
      width: 1px;
      height: 2.5rem;
      background: #c4b5a5;
      margin: 0 auto;
    }

    main {
      width: 100%;
      max-width: var(--max-width);
      padding: 4rem 0 5rem;
    }

    /* ── perspective (top-level) ── */

    .perspective {
      padding: 2.6rem 0;
    }

    .perspective + .perspective {
      border-top: 1px solid var(--rule);
    }

    .perspective-text {
      font-size: 1rem;
      line-height: 1.9;
      color: var(--text);
      white-space: pre-wrap;
    }

    .perspective-voice {
      margin-top: 1.2rem;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .perspective-voice::before { content: '— '; }

    .perspective-voice a {
      color: inherit;
      text-decoration: none;
    }

    .perspective-voice a:hover { color: var(--text); }

    /* ── responses (nested) ── */

    .responses {
      margin-top: 1.8rem;
    }

    .response {
      padding: 1.4rem 1.4rem 1.2rem 1.4rem;
      background: #f2ede8;
      border-radius: 2px;
      border-left: 2px solid var(--parent-color, #c4b5a5);
      margin-top: 0.9rem;
    }

    .response-text {
      font-size: 0.93rem;
      line-height: 1.85;
      color: var(--text);
      white-space: pre-wrap;
    }

    .response-voice {
      margin-top: 1rem;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .response-voice::before { content: '— '; }

    .response-voice a {
      color: inherit;
      text-decoration: none;
    }

    .response-voice a:hover { color: var(--text); }

    /* ── invite ── */

    .invite {
      margin-top: 1.4rem;
      font-size: 0.75rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #b8aea6;
      font-style: italic;
    }

    .invite a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .invite a:hover { color: var(--text-muted); }

    /* ── states ── */

    .still {
      padding: 4rem 0;
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.9rem;
      line-height: 1.8;
    }

    /* ── footer ── */

    footer {
      width: 100%;
      max-width: var(--max-width);
      padding: 2.5rem 0 5rem;
      border-top: 1px solid var(--rule);
      text-align: center;
    }

    footer p {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 2.2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    footer a:hover { color: var(--text); }

    @media (max-width: 480px) {
      html { font-size: 16px; }
      header { padding: 3.5rem 0 3rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Shared Breath</h1>
    <p>Open space for gentle connection —<br>
    individual perspective able to grow from honest expression</p>
  </header>

  <div class="breath-line"></div>

  <main id="main">
    <div class="still">gathering voices…</div>
  </main>

  <footer>
    <p>
      <a href="https://github.com/AuroraQuen/Shared-Breath/issues/new?template=perspective.md" target="_blank" rel="noopener">bring a perspective</a>
      &nbsp;·&nbsp;
      <a href="https://github.com/AuroraQuen/Shared-Breath/issues" target="_blank" rel="noopener">all voices</a>
    </p>
  </footer>

  <script>
    const REPO = 'AuroraQuen/Shared-Breath';
    const API  = 'https://api.github.com';
    const HEADERS = { 'Accept': 'application/vnd.github.v3+json' };

    // deterministic voice color from name
    function voiceColor(name) {
      let h = 0;
      for (const c of String(name)) h = (Math.imul(31, h) + c.charCodeAt(0)) | 0;
      const hue = ((Math.abs(h) % 360) + 360) % 360;
      return `oklch(68% 0.07 ${hue})`;
    }

    function safe(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function fetchJSON(url) {
      const res = await fetch(url, { headers: HEADERS });
      if (!res.ok) throw new Error(`${res.status}`);
      return res.json();
    }

    async function load() {
      const main = document.getElementById('main');
      try {
        const issues = await fetchJSON(
          `${API}/repos/${REPO}/issues?state=open&per_page=100`
        );

        if (!issues.length) {
          main.innerHTML = '<div class="still">the space is open, waiting</div>';
          return;
        }

        // fetch all comment threads in parallel
        const commentSets = await Promise.all(
          issues.map(issue =>
            fetchJSON(`${API}/repos/${REPO}/issues/${issue.number}/comments`)
              .catch(() => [])
          )
        );

        main.innerHTML = issues.map((issue, i) => {
          const color = voiceColor(issue.title || issue.user.login);
          const comments = commentSets[i] || [];

          const responsesHtml = comments.length
            ? `<div class="responses">
                ${comments.map(c => {
                  const cColor = voiceColor(c.user.login);
                  return `
                    <div class="response" style="--parent-color: ${safe(color)}">
                      <p class="response-text">${safe(c.body)}</p>
                      <p class="response-voice">
                        <a href="${safe(c.html_url)}" target="_blank" rel="noopener">${safe(c.user.login)}</a>
                      </p>
                    </div>`;
                }).join('')}
              </div>`
            : '';

          return `
            <div class="perspective">
              <p class="perspective-text">${safe(issue.body || '')}</p>
              <p class="perspective-voice">
                <a href="${safe(issue.html_url)}" target="_blank" rel="noopener">${safe(issue.title)}</a>
              </p>
              ${responsesHtml}
              <p class="invite">
                <a href="${safe(issue.html_url)}" target="_blank" rel="noopener">something to add?</a>
              </p>
            </div>`;
        }).join('');

      } catch (e) {
        main.innerHTML = `<div class="still">the space is resting — <a href="https://github.com/${REPO}/issues" target="_blank" rel="noopener">visit directly</a></div>`;
      }
    }

    load();
  </script>

</body>
</html>
